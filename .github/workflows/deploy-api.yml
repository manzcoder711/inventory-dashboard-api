name: Deploy API to Azure App Service

on:
  push:
    branches:
      - main
  # PRs (including Dependabot's) get built and tested, but never deployed - see the `if` below.
  pull_request:
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: inventory-api-forIN
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # A failing test fails the job here, so Publish and Deploy below never run.
      - name: Test
        run: dotnet test InventoryApi.Tests --configuration Release

      - name: Publish
        if: github.event_name == 'push'
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Deploy to Azure App Service
        if: github.event_name == 'push'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
